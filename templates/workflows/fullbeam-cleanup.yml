name: Fullbeam cleanup sweep

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fullbeam-cleanup-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  sweep:
    if: >-
      github.event.repository.fork == false &&
      github.event.repository.full_name == github.repository &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
        working-directory: .fullbeam/controller
    steps:
      - name: Check out the protected default-branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: "false"
          fetch-depth: "1"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .fullbeam/controller/package-lock.json

      - name: Install the protected cleanup controller without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate trusted runtime lock
        run: test -f ../../.fullbeam/runtime.lock.json

      - name: Sweep orphaned Fullbeam resources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULLBEAM_INSTACLOUD_API_TOKEN: ${{ secrets.FULLBEAM_INSTACLOUD_API_TOKEN }}
          INSTA_ORG_ID: ${{ vars.INSTA_ORG_ID }}
          FULLBEAM_INSTACLOUD_REGION: ${{ vars.FULLBEAM_INSTACLOUD_REGION }}
        run: npm run fullbeam -- sweep
